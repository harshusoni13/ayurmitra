<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AyurMitra | Classical Ayurvedic Maternal Health Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .devanagari { font-family: 'Noto Serif Devanagari', serif; }
    .brand-title { font-family: 'Cinzel', serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const API_BASE = "http://127.0.0.1:8000";

    const MONTHS = [
      { id: 1, label: "Month 1 (Prathama)" },
      { id: 2, label: "Month 2 (Dvitiya)" },
      { id: 3, label: "Month 3 (Tritiya)" },
      { id: 4, label: "Month 4 (Chaturtha)" },
      { id: 5, label: "Month 5 (Panchama)" },
      { id: 6, label: "Month 6 (Shashtha)" },
      { id: 7, label: "Month 7 (Saptama)" },
      { id: 8, label: "Month 8 (Ashtama)" },
      { id: 9, label: "Month 9 (Navama)" }
    ];

    function App() {
      const [query, setQuery] = useState("");
      const [loading, setLoading] = useState(false);
      const [results, setResults] = useState(null);
      const [error, setError] = useState(null);

      const handleSearch = async (searchQuery) => {
        const textToSearch = searchQuery || query;
        if (!textToSearch.trim()) return;

        setLoading(true);
        setError(null);

        try {
          const res = await fetch(`${API_BASE}/api/retrieve`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: textToSearch, top_k: 4 })
          });

          if (!res.ok) throw new Error("Backend server did not respond correctly.");

          const data = await res.json();
          setResults(data);
        } catch (err) {
          setError("Failed to connect to AyurMitra API. Ensure the uvicorn backend is running.");
        } finally {
          setLoading(false);
        }
      };

      const selectMonth = (mNum) => {
        const q = `Month ${mNum} Masanumasika Garbhini Paricharya regimen and guidelines`;
        setQuery(q);
        handleSearch(q);
      };

      return (
        <div class="max-w-6xl mx-auto px-4 py-8">
          {/* Header */}
          <header class="border-b border-amber-900/10 pb-6 mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-2xl">🌿</span>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900 brand-title">AyurMitra</h1>
                <span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-amber-300">
                  AyurParam 2.9B Grounded
                </span>
              </div>
              <p class="text-slate-600 text-sm mt-1">
                Classical Ayurvedic Maternal Knowledge & Research Assistant (Charaka, Sushruta, Vagbhata, Kashyapa)
              </p>
            </div>
            <div class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full border border-slate-200 self-start md:self-auto font-medium">
              IIT Bombay Techfest • AyushTech Innovate
            </div>
          </header>

          {/* Clinical Safety Notice */}
          <div class="bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-lg mb-8 shadow-sm">
            <div class="flex items-start">
              <span class="text-amber-600 font-bold mr-2">⚠️</span>
              <p class="text-xs text-amber-900 leading-relaxed">
                <strong>Academic & Research Tool:</strong> Grounded strictly in authentic Samhita verses. Designed for students, researchers, and clinicians. Not an emergency diagnostic instrument.
              </p>
            </div>
          </div>

          {/* Search Box */}
          <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 mb-6">
            <form onSubmit={(e) => { e.preventDefault(); handleSearch(); }} class="flex flex-col sm:flex-row gap-2">
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Ask in Hindi or English (e.g. 'Why is milk given in 1st month?' or '6th month gokshura')..."
                class="flex-1 px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-slate-800 placeholder-slate-400 text-sm md:text-base"
              />
              <button
                type="submit"
                disabled={loading}
                class="bg-slate-900 hover:bg-slate-800 text-amber-200 font-medium px-6 py-3 rounded-xl transition duration-150 disabled:opacity-50 text-sm whitespace-nowrap flex items-center justify-center gap-2"
              >
                {loading ? "Synthesizing..." : "Query Corpus"}
              </button>
            </form>

            {/* Quick Month Chips */}
            <div class="mt-4 pt-3 border-t border-slate-100">
              <div class="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Quick Browse Gestational Months:</div>
              <div class="flex flex-wrap gap-1.5">
                {MONTHS.map((m) => (
                  <button
                    key={m.id}
                    onClick={() => selectMonth(m.id)}
                    class="text-xs bg-slate-100 hover:bg-amber-100 hover:text-amber-900 text-slate-700 px-3 py-1.5 rounded-lg border border-slate-200 transition"
                  >
                    M{m.id}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Error */}
          {error && (
            <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl mb-6 text-sm">
              {error}
            </div>
          )}

          {/* Loading */}
          {loading && (
            <div class="text-center py-12">
              <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-amber-600 mx-auto mb-3"></div>
              <p class="text-sm text-slate-500">Searching FAISS index and preparing AyurParam context...</p>
            </div>
          )}

          {/* Results Area */}
          {results && !loading && (
            <div class="space-y-6">
              {/* AyurParam Inference Card */}
              <div class="bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 text-white rounded-2xl p-6 shadow-md border border-slate-700">
                <div class="flex items-center justify-between mb-3 border-b border-slate-700 pb-2">
                  <div class="flex items-center gap-2">
                    <span class="text-amber-400 font-bold text-sm">🧠 {results.inference.model}</span>
                    <span class={`text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${
                      results.inference.status === 'online' ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40' : 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                    }`}>
                      {results.inference.status}
                    </span>
                  </div>
                  <span class="text-xs text-slate-400">Strict Source Grounding</span>
                </div>

                {results.inference.synthesized_answer ? (
                  <p class="text-sm md:text-base leading-relaxed text-slate-100">
                    {results.inference.synthesized_answer}
                  </p>
                ) : (
                  <div class="text-xs text-slate-300 bg-slate-800/80 p-3 rounded-xl border border-slate-700">
                    <p class="font-medium text-amber-300 mb-1">RAG Verification Standby Mode:</p>
                    <p>{results.inference.message}</p>
                    <p class="mt-1 text-slate-400">100% verified classical verses and citations have been retrieved from the vector database below.</p>
                  </div>
                )}
              </div>

              {/* Citations Count */}
              <div class="flex items-center justify-between text-xs text-slate-500 pb-2 border-b">
                <span>Retrieved <strong>{results.results_count} authentic classical citations</strong></span>
                <span class="text-emerald-700 font-semibold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">100% Grounded</span>
              </div>

              {/* Citation Cards */}
              <div class="grid grid-cols-1 gap-6">
                {results.citations.map((cite, idx) => (
                  <div key={idx} class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="bg-slate-900 text-white px-6 py-4 flex flex-wrap items-center justify-between gap-2">
                      <div class="flex items-center gap-3">
                        <span class="bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-md tracking-wide">
                          {cite.authority || "Classical Samhita"}
                        </span>
                        <span class="text-slate-300 text-xs font-mono">{cite.reference}</span>
                      </div>
                      <span class="text-xs text-amber-300 font-medium">
                        {cite.month_name} (Month {cite.month})
                      </span>
                    </div>

                    <div class="p-6 space-y-4">
                      {cite.sanskrit && (
                        <div class="bg-amber-50/60 border border-amber-200/80 rounded-xl p-4">
                          <div class="text-xs uppercase tracking-wider text-amber-800 font-semibold mb-1">Mula Shloka (मूल श्लोक):</div>
                          <p class="devanagari text-slate-900 text-base md:text-lg leading-relaxed font-semibold">
                            {cite.sanskrit}
                          </p>
                        </div>
                      )}

                      {cite.regimen && (
                        <div>
                          <div class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Prescribed Regimen (आहार-विहार):</div>
                          <p class="text-slate-800 text-sm leading-relaxed">{cite.regimen}</p>
                        </div>
                      )}

                      {cite.rationale && (
                        <div class="border-t pt-3">
                          <div class="text-xs uppercase tracking-wider text-slate-500 font-semibold mb-1">Clinical Rationale (हेतु):</div>
                          <p class="text-slate-700 text-sm leading-relaxed italic">{cite.rationale}</p>
                        </div>
                      )}

                      {cite.dos && cite.dos.length > 0 && (
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                          <div class="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3.5">
                            <div class="text-xs font-bold text-emerald-800 uppercase tracking-wider mb-2">Pathya (Recommended Do's):</div>
                            <ul class="text-xs text-emerald-950 space-y-1 list-disc list-inside">
                              {cite.dos.map((d, i) => <li key={i}>{d}</li>)}
                            </ul>
                          </div>
                          <div class="bg-rose-50/70 border border-rose-200 rounded-xl p-3.5">
                            <div class="text-xs font-bold text-rose-800 uppercase tracking-wider mb-2">Apathya (Contraindicated Don'ts):</div>
                            <ul class="text-xs text-rose-950 space-y-1 list-disc list-inside">
                              {cite.donts.map((d, i) => <li key={i}>{d}</li>)}
                            </ul>
                          </div>
                        </div>
                      )}

                      {cite.modern_correlation && (
                        <div class="bg-blue-50/60 border border-blue-200 rounded-xl p-3.5 text-xs text-blue-950">
                          <span class="font-bold uppercase tracking-wider text-blue-900 block mb-1">Modern Obstetric Correlation:</span>
                          {cite.modern_correlation}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Footer */}
          <footer class="mt-16 text-center text-xs text-slate-400 border-t pt-6">
            AyurMitra Research Assistant • Developed for AyushTech Innovate • MIT Open-Source Licence
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
